name: PR

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Don't want the tests running in parallel
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout ✅
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Helm docs 🤖
        uses: losisin/helm-docs-github-action@v1
        with:
          git-push: true
          git-push-user-name: "${{ github.actor }}"
          git-push-user-email: "${{ github.actor }}@users.noreply.github.com"
          git-commit-message: "🧹 update chart documentation"

  chart-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ✅
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm ⎈
        uses: azure/setup-helm@v4

      - name: Set up Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          check-latest: true

      - name: Set up chart-testing 🧪
        uses: helm/chart-testing-action@v2

      - name: List changed charts 🔍
        id: list-changed
        run: |
          changed="$(ct list-changed --target-branch "${{ github.event.pull_request.base.ref }}")"
          echo "changed<<EOF" >> "$GITHUB_OUTPUT"
          echo "$changed" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          if [ -n "$changed" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

      # Catches: missing/invalid Chart.yaml fields, forgetting to bump `version` (chart-releaser
      # silently skips publishing an unbumped chart on merge — see ct.yaml's
      # check-version-increment), unbuildable chart dependencies, and values.yaml violating
      # values.schema.json where present.
      - name: Lint changed charts (ct lint) 🧹
        if: steps.list-changed.outputs.any == 'true'
        run: ct lint --target-branch "${{ github.event.pull_request.base.ref }}"

      - name: Install kubeconform 🔧
        if: steps.list-changed.outputs.any == 'true'
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform

      # Renders each changed chart (using its ci/*-values.yaml fixture when present, to satisfy
      # any required values.schema.json fields) and validates the output against the real
      # Kubernetes API schema — catches typo'd/misplaced fields, wrong types, and other mistakes
      # `helm template`/`helm lint` alone don't catch.
      - name: Validate rendered manifests against Kubernetes schema (kubeconform) 🔎
        if: steps.list-changed.outputs.any == 'true'
        run: |
          set -euo pipefail
          while IFS= read -r chart; do
            [ -z "$chart" ] && continue
            values_args=()
            if compgen -G "$chart/ci/*-values.yaml" > /dev/null; then
              for f in "$chart"/ci/*-values.yaml; do
                values_args+=(-f "$f")
              done
            fi
            echo "::group::kubeconform: $chart"
            helm template "$chart" "${values_args[@]}" \
              | kubeconform -strict -summary -ignore-missing-schemas \
                  -kubernetes-version "$(sed -nE 's/^kubeVersion:\s*"?>=([0-9]+\.[0-9]+).*/\1.0/p' "$chart/Chart.yaml" | head -1)"
            echo "::endgroup::"
          done <<< "${{ steps.list-changed.outputs.changed }}"
